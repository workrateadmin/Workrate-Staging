openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WorkRate API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: company
    description: Company profile operations
  - name: enquiries
    description: Customer enquiry operations
  - name: quotes
    description: Quote operations
  - name: chat
    description: Public customer AI chat operations
  - name: dashboard
    description: Dashboard summary operations
  - name: integrations
    description: Third-party integration management
  - name: invoices
    description: Standalone invoice operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Company Profile
  /company:
    get:
      operationId: getCompany
      tags: [company]
      summary: Get company profile
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    put:
      operationId: updateCompany
      tags: [company]
      summary: Update company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "200":
          description: Updated company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  # Enquiries
  /enquiries:
    get:
      operationId: listEnquiries
      tags: [enquiries]
      summary: List all enquiries
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enquiry"
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Create a new enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Created enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"

  /enquiries/{id}/calls:
    get:
      operationId: listEnquiryAiCalls
      tags: [enquiries, ai-receptionist]
      summary: List phone-call activity linked to an enquiry
      security:
        - ClerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Tenant-scoped calls linked to the enquiry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiCall"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /enquiries/{id}/timeline:
    get:
      operationId: getEnquiryTimeline
      tags: [enquiries]
      summary: Get the unified activity timeline for an enquiry
      security:
        - ClerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - $ref: "#/components/parameters/TimelineLimit"
        - $ref: "#/components/parameters/TimelineOffset"
        - $ref: "#/components/parameters/TimelineOrder"
        - $ref: "#/components/parameters/TimelineCategory"
      responses:
        "200":
          description: Tenant-scoped timeline page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelinePage" }
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /enquiries/{id}:
    get:
      operationId: getEnquiry
      tags: [enquiries]
      summary: Get enquiry by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateEnquiry
      tags: [enquiries]
      summary: Update enquiry (status, notes, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryUpdate"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteEnquiry
      tags: [enquiries]
      summary: Delete an enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /enquiries/{id}/messages:
    get:
      operationId: listEnquiryMessages
      tags: [enquiries]
      summary: Get chat messages for an enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnquiryMessage"

  /enquiries/{id}/attachments:
    get:
      operationId: listEnquiryAttachments
      tags: [enquiries]
      summary: List all attachments for an enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnquiryAttachment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: uploadEnquiryAttachment
      tags: [enquiries]
      summary: Upload a file attachment to an enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: Uploaded attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryAttachment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /enquiries/{id}/attachments/{attachmentId}:
    delete:
      operationId: deleteEnquiryAttachment
      tags: [enquiries]
      summary: Delete an attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: attachmentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /enquiries/{id}/generate-summary:
    post:
      operationId: generateEnquirySummary
      tags: [enquiries]
      summary: Generate AI job summary for an enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated enquiry with AI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Proposal (public – no auth)
  /proposals/{token}:
    get:
      operationId: getProposal
      tags: [quotes]
      summary: Get a public proposal by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /proposals/{token}/view:
    post:
      operationId: recordProposalView
      tags: [quotes]
      summary: Record that the customer viewed the proposal
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /proposals/{token}/respond:
    post:
      operationId: respondToProposal
      tags: [quotes]
      summary: Customer accepts, declines, or asks a question
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalResponse"
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /enquiries/{id}/quote/approve-and-send:
    post:
      operationId: approveAndSendProposal
      tags: [quotes]
      summary: Tradesperson approves a quote and sends it as a proposal to the customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Approved proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /enquiries/{id}/quote/resend-proposal-email:
    post:
      operationId: resendProposalEmail
      tags: [quotes]
      summary: Re-send the proposal email to the customer (retry on failure or resend)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated quote with new email status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /enquiries/{id}/quote/pdf:
    get:
      operationId: downloadQuotePdf
      tags: [quotes]
      summary: Download a quote or proposal as a PDF
      security:
        - ClerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Branded quote or proposal PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /enquiries/{id}/quote/mark-deposit-paid:
    post:
      operationId: markDepositPaid
      tags: [quotes]
      summary: Tradesperson manually marks the deposit as received
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkDepositPaidBody"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Quotes
  /enquiries/{id}/quote:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get quote for an enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: generateQuote
      tags: [quotes]
      summary: Generate a draft AI quote for an enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "201":
          description: Generated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateQuote
      tags: [quotes]
      summary: Update a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUpdate"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Jobs
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreate"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /jobs/{id}/timeline:
    get:
      operationId: getJobTimeline
      tags: [jobs]
      summary: Get the unified activity timeline for a job
      security:
        - ClerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - $ref: "#/components/parameters/TimelineLimit"
        - $ref: "#/components/parameters/TimelineOffset"
        - $ref: "#/components/parameters/TimelineOrder"
        - $ref: "#/components/parameters/TimelineCategory"
      responses:
        "200":
          description: Tenant-scoped timeline page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelinePage" }
        "404":
          description: Job not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /jobs/{id}/schedule:
    patch:
      operationId: scheduleJob
      tags: [jobs]
      summary: Update scheduling dates for a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobScheduleUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /enquiries/{id}/convert-to-job:
    post:
      operationId: convertEnquiryToJob
      tags: [jobs]
      summary: Convert an accepted enquiry/quote to a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Job (created now, or already existed — endpoint is idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Integrations
  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: List all integration providers with connection status
      responses:
        "200":
          description: List of integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationStatus"

  /integrations/widget/heartbeat:
    post:
      operationId: recordWidgetHeartbeat
      tags: [integrations]
      summary: Record that a tenant widget successfully loaded without creating an enquiry
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WidgetHeartbeatInput"
      responses:
        "202":
          description: Heartbeat accepted without confirming whether the tenant token exists
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
        "400":
          description: Invalid heartbeat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /integrations/widget/status:
    get:
      operationId: getWidgetInstallationStatus
      tags: [integrations]
      summary: Get the authenticated tenant's recent widget-load status
      security:
        - ClerkAuth: []
      responses:
        "200":
          description: Recent tenant-scoped widget installation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetInstallationStatus"

  /integrations/vapi/settings:
    get:
      operationId: getVapiSettings
      tags: [integrations, ai-receptionist]
      summary: Get the current user's safe Vapi phone mapping
      security:
        - ClerkAuth: []
      responses:
        "200":
          description: Vapi mapping without its webhook secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiSettings"

  /integrations/vapi/connect:
    post:
      operationId: connectVapi
      tags: [integrations, ai-receptionist]
      summary: Save a tenant-scoped Vapi phone mapping
      security:
        - ClerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VapiConnectionInput"
      responses:
        "200":
          description: Saved Vapi mapping without its webhook secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapiSettings"
        "400":
          description: Invalid connection settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /integrations/{provider}:
    get:
      operationId: getIntegration
      tags: [integrations]
      summary: Get a specific integration provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: disconnectIntegration
      tags: [integrations]
      summary: Disconnect an integration
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Disconnected
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /integrations/{provider}/connect:
    post:
      operationId: connectIntegration
      tags: [integrations]
      summary: Connect an integration (stub — returns 501 until built)
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"
        "501":
          description: Not yet implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Dashboard
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard statistics and recent activity
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # Public customer chat (no auth required)
  /chat/start:
    post:
      operationId: startChat
      tags: [chat]
      summary: Start a new customer chat session (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatStartInput"
      responses:
        "201":
          description: New chat session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"

  /chat/{token}/message:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message in a customer chat session (public, SSE response)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: SSE stream of AI response chunks
          content:
            text/event-stream: {}
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /chat/{token}:
    get:
      operationId: getChatSession
      tags: [chat]
      summary: Get chat session and messages (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chat session with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # AI Receptionist Settings
  /ai-receptionist/settings:
    get:
      operationId: getAiReceptionistSettings
      tags: [ai-receptionist]
      summary: Get AI receptionist settings
      security:
        - ClerkAuth: []
      responses:
        "200":
          description: AI receptionist settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReceptionistSettings"
    put:
      operationId: updateAiReceptionistSettings
      tags: [ai-receptionist]
      summary: Update AI receptionist settings
      security:
        - ClerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiReceptionistSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReceptionistSettings"

  # AI Calls
  /ai-calls:
    get:
      operationId: listAiCalls
      tags: [ai-receptionist]
      summary: List all AI call records
      security:
        - ClerkAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: Filter by date (YYYY-MM-DD)
        - name: followUpRequired
          in: query
          required: false
          schema:
            type: string
          description: Filter by follow-up required (true/false)
      responses:
        "200":
          description: List of AI calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiCall"
    post:
      operationId: createAiCall
      tags: [ai-receptionist]
      summary: Create a new AI call record (used by telephony providers)
      security:
        - ClerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiCallCreate"
      responses:
        "201":
          description: Created AI call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCall"

  /ai-calls/{id}:
    get:
      operationId: getAiCall
      tags: [ai-receptionist]
      summary: Get a single AI call record
      security:
        - ClerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: AI call record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCall"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAiCall
      tags: [ai-receptionist]
      summary: Update an AI call record
      security:
        - ClerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiCallUpdate"
      responses:
        "200":
          description: Updated AI call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCall"

  /ai-calls/{id}/process:
    post:
      operationId: processAiCall
      tags: [ai-receptionist]
      summary: Process a completed call — create enquiry, generate AI summary
      security:
        - ClerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Processed call with enquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCall"

  # Demo / simulation mode
  /ai-receptionist/demo/message:
    post:
      operationId: sendDemoMessage
      tags: [ai-receptionist]
      summary: Send a message in a demo AI receptionist conversation (returns SSE stream)
      security:
        - ClerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoMessageRequest"
      responses:
        "200":
          description: SSE stream of AI response chunks
          content:
            text/event-stream:
              schema:
                type: string

  /ai-receptionist/demo/complete:
    post:
      operationId: completeDemoCall
      tags: [ai-receptionist]
      summary: Complete a demo call — create a fake AI call record from the conversation
      security:
        - ClerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoCompleteRequest"
      responses:
        "201":
          description: Created demo AI call record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCall"

  # Invoices (standalone — no enquiry required)
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices for the authenticated user
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a standalone invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreate"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /invoices/{id}/pdf:
    get:
      operationId: downloadInvoicePdf
      tags: [invoices]
      summary: Download an invoice as a PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Branded invoice PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /invoices/{id}/send:
    post:
      operationId: sendInvoice
      tags: [invoices]
      summary: Send invoice email to customer and mark as sent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated invoice with email status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /invoices/{id}/mark-paid:
    post:
      operationId: markInvoicePaid
      tags: [invoices]
      summary: Mark invoice as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceMarkPaidBody"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /invoices/{id}/mark-deposit-paid:
    post:
      operationId: markInvoiceDepositPaid
      tags: [invoices]
      summary: Record the requested invoice deposit as received
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Invoice does not have an outstanding deposit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /finance/categories:
    get:
      operationId: getFinanceCategories
      tags: [finance]
      summary: List configurable finance category suggestions
      responses:
        "200":
          description: Category suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCategories"

  /finance/summary:
    get:
      operationId: getFinanceSummary
      tags: [finance]
      summary: Get tax-preparation summary without HMRC submission
      parameters:
        - $ref: "#/components/parameters/FinancePeriodFrom"
        - $ref: "#/components/parameters/FinancePeriodTo"
      responses:
        "200":
          description: Finance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"

  /finance/hmrc/status:
    get:
      operationId: getHmrcConnectionStatus
      tags: [finance]
      summary: Get the signed-in business's HMRC sandbox connection status
      responses:
        "200":
          description: HMRC sandbox connection status and last read-only sync data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HmrcConnectionStatus"

  /finance/hmrc/connect:
    post:
      operationId: startHmrcSandboxConnection
      tags: [finance]
      summary: Start tenant-bound HMRC sandbox OAuth authorisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HmrcConnectionInput"
      responses:
        "200":
          description: Secure HMRC authorisation URL for the current business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HmrcAuthorizationStart"
        "400":
          description: Invalid taxpayer identifier or browser metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: HMRC sandbox OAuth has not been configured server-side
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /finance/hmrc/sync:
    post:
      operationId: syncHmrcSandboxData
      tags: [finance]
      summary: Retrieve read-only HMRC sandbox business details and obligations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HmrcSyncInput"
      responses:
        "200":
          description: Current connection status with refreshed read-only MTD data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HmrcConnectionStatus"
        "400":
          description: Invalid browser metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No connection exists for the signed-in business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Read-only HMRC data could not be synchronised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /finance/hmrc:
    delete:
      operationId: disconnectHmrcSandbox
      tags: [finance]
      summary: Remove the signed-in business's local HMRC sandbox connection
      responses:
        "204":
          description: Local encrypted tokens and connection metadata removed
        "404":
          description: No connection exists for the signed-in business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /hmrc/callback:
    get:
      operationId: completeHmrcSandboxAuthorization
      tags: [finance]
      summary: Complete a tenant-bound HMRC sandbox OAuth callback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirects back to the Finance page after processing the callback
        "400":
          description: Invalid, expired, or already-used callback state
        "403":
          description: Callback belongs to a different WorkRate business

  /finance/expenses:
    get:
      operationId: listFinanceExpenses
      tags: [finance]
      summary: List finance expenses for the signed-in business
      parameters:
        - $ref: "#/components/parameters/FinancePeriodFrom"
        - $ref: "#/components/parameters/FinancePeriodTo"
      responses:
        "200":
          description: Expense records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceExpense"
    post:
      operationId: createFinanceExpense
      tags: [finance]
      summary: Create a manual expense record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceExpenseInput"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceExpense"

  /finance/export.csv:
    get:
      operationId: exportFinanceCsv
      tags: [finance]
      summary: Export tenant-scoped finance activity as a spreadsheet-safe CSV
      parameters:
        - $ref: "#/components/parameters/FinancePeriodFrom"
        - $ref: "#/components/parameters/FinancePeriodTo"
      responses:
        "200":
          description: Accountant-ready finance export for the selected period
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /finance/transactions:
    get:
      operationId: listFinanceTransactions
      tags: [finance]
      summary: List filtered expense records and receipt evidence for Tax / MTD review
      parameters:
        - $ref: "#/components/parameters/FinancePeriodFrom"
        - $ref: "#/components/parameters/FinancePeriodTo"
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: reviewStatus
          in: query
          required: false
          schema:
            type: string
        - name: hasReceipt
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Reviewable expense records and linked receipt documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceTransaction"

  /finance/expenses/{id}:
    patch:
      operationId: updateFinanceExpense
      tags: [finance]
      summary: Edit a finance expense before or after review
      parameters:
        - $ref: "#/components/parameters/FinanceRecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceExpenseInput"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceExpense"

  /finance/expenses/{id}/confirm:
    post:
      operationId: confirmFinanceExpense
      tags: [finance]
      summary: Confirm or correct human-reviewed receipt values
      parameters:
        - $ref: "#/components/parameters/FinanceRecordId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                wasCorrected:
                  type: boolean
      responses:
        "200":
          description: Confirmed expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceExpense"

  /finance/receipts:
    get:
      operationId: listFinanceReceipts
      tags: [finance]
      summary: List private receipt evidence for the signed-in business
      responses:
        "200":
          description: Receipt evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceReceipt"
    post:
      operationId: uploadFinanceReceipt
      tags: [finance]
      summary: Upload private receipt evidence and create AI suggestions for review
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                jobId:
                  type: number
              required: [file]
      responses:
        "201":
          description: Receipt stored; extraction remains unconfirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  expense:
                    $ref: "#/components/schemas/FinanceExpense"
                  receipt:
                    $ref: "#/components/schemas/FinanceReceipt"
                required: [expense, receipt]

  /finance/receipts/{id}/file:
    get:
      operationId: downloadFinanceReceipt
      tags: [finance]
      summary: Stream a private receipt after verifying tenant ownership
      parameters:
        - $ref: "#/components/parameters/FinanceRecordId"
      responses:
        "200":
          description: Receipt document
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /finance/income:
    get:
      operationId: listFinanceIncome
      tags: [finance]
      summary: List derived invoice activity and manually recorded other income
      parameters:
        - $ref: "#/components/parameters/FinancePeriodFrom"
        - $ref: "#/components/parameters/FinancePeriodTo"
      responses:
        "200":
          description: Income activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceIncome"
    post:
      operationId: createFinanceIncome
      tags: [finance]
      summary: Record income not already represented by a WorkRate invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceIncomeInput"
      responses:
        "201":
          description: Created other-income record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceIncome"

  /finance/income/{id}:
    patch:
      operationId: updateFinanceIncome
      tags: [finance]
      summary: Edit a manually recorded other-income record
      parameters:
        - $ref: "#/components/parameters/FinanceRecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceIncomeUpdate"
      responses:
        "200":
          description: Updated other-income record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceIncomeRecord"

  /finance/audit:
    get:
      operationId: listFinanceAudit
      tags: [finance]
      summary: List finance record audit events for the signed-in business
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceAuditEvent"

  /billing/catalog:
    get:
      operationId: getBillingCatalog
      tags: [billing]
      responses: { "200": { description: Catalog, content: { application/json: { schema: { $ref: "#/components/schemas/BillingCatalog" } } } } }
  /billing/receptionist-top-ups:
    get:
      operationId: getReceptionistTopUpPacks
      tags: [billing]
      summary: List AI Receptionist one-time minute packs
      responses: { "200": { description: Top-up packs, content: { application/json: { schema: { $ref: "#/components/schemas/ReceptionistTopUpPackList" } } } } }
  /billing/receptionist-top-ups/checkout:
    post:
      operationId: createReceptionistTopUpCheckout
      tags: [billing]
      summary: Create hosted one-time Checkout for a server-selected pack
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReceptionistTopUpCheckoutInput" } } } }
      responses:
        "200": { description: Hosted Checkout, content: { application/json: { schema: { $ref: "#/components/schemas/ReceptionistTopUpCheckout" } } } }
        "400": { description: "Invalid pack, missing entitlement, or no authoritative billing period" }
        "501": { description: Payment provider unavailable }
  /internal/billing/catalog:
    get:
      operationId: getInternalBillingCatalog
      tags: [billing]
      summary: View server billing configuration (internal administrators only)
      description: Requires the authenticated Clerk user ID to be present in the comma-separated WORKRATE_ADMIN_USER_IDS server allowlist. Access is denied when it is unset.
      responses:
        "200":
          description: Internal catalog configuration, including provider mappings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalBillingCatalog" }
        "403": { description: Administrator access required }
  /internal/billing/profitability/{companyId}:
    get:
      operationId: getInternalBillingProfitability
      tags: [billing]
      summary: View verified direct provider costs and minimal Vapi call history
      description: Internal administrators only. Provider costs are canonical Vapi GET /call/:id values; no provider cost, phone number, transcript, or raw provider response is exposed to customers. Amounts with no authoritative currency are explicitly unavailable and are never represented as GBP.
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: number, minimum: 1 }
      responses:
        "200":
          description: Internal profitability and verified direct provider-cost history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalBillingProfitability" }
        "403": { description: Administrator access required }
        "404": { description: No Stripe billing period for this tenant }
  /internal/billing/receptionist-top-ups/{code}:
    patch:
      operationId: updateInternalReceptionistTopUpPack
      tags: [billing]
      summary: Update an AI Receptionist top-up pack
      description: Internal only. Customer prices and Stripe one-time mappings remain unavailable until the mapping is explicitly validated.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InternalReceptionistTopUpPackUpdate" }
      responses:
        "200": { description: Updated top-up pack, content: { application/json: { schema: { $ref: "#/components/schemas/InternalReceptionistTopUpPack" } } } }
        "400": { description: Invalid configuration }
        "403": { description: Administrator access required }
        "404": { description: Top-up pack not found }
  /internal/billing/receptionist-top-ups/{code}/validate-mapping:
    post:
      operationId: validateInternalReceptionistTopUpPackMapping
      tags: [billing]
      summary: Verify an AI Receptionist one-time Stripe price mapping
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Verified top-up pack, content: { application/json: { schema: { $ref: "#/components/schemas/InternalReceptionistTopUpPack" } } } }
        "400": { description: Mapping invalid or billing configuration required }
        "403": { description: Administrator access required }
        "404": { description: Top-up pack not found }
  /internal/billing/{kind}/{code}:
    patch:
      operationId: updateInternalBillingCatalogItem
      tags: [billing]
      summary: Update server-controlled billing pricing or mappings
      description: Internal only. Stripe mappings are set by explicitly running seed:stripe-billing in development after configuring catalogue prices; they are never exposed by the customer catalog.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [plan, add-on] }
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses: { "200": { description: Updated internal catalog item }, "400": { description: Invalid configuration }, "403": { description: Administrator access required } }
  /internal/billing/{kind}/{code}/validate-mapping:
    post:
      operationId: validateInternalBillingCatalogMapping
      tags: [billing]
      summary: Verify stored Stripe mapping and enable purchase availability
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [plan, add-on] }
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Verified internal catalog item, content: { application/json: { schema: { $ref: "#/components/schemas/InternalBillingCatalogItem" } } } }
        "400": { description: Mapping invalid or billing configuration required }
        "403": { description: Administrator access required }
  /billing:
    get:
      operationId: getBillingOverview
      tags: [billing]
      responses: { "200": { description: Billing overview, content: { application/json: { schema: { $ref: "#/components/schemas/BillingOverview" } } } } }
  /billing/selection:
    put:
      operationId: saveBillingSelection
      tags: [billing]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BillingSelectionInput" } } } }
      responses: { "200": { description: Saved selection, content: { application/json: { schema: { $ref: "#/components/schemas/BillingOverview" } } } }, "400": { description: Invalid selection } }
  /billing/checkout:
    post:
      operationId: requestBillingCheckout
      tags: [billing]
      responses: { "200": { description: Hosted checkout, content: { application/json: { schema: { $ref: "#/components/schemas/BillingHostedUrl" } } } }, "501": { description: Provider unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentUnavailable" } } } } }
  /billing/portal:
    post:
      operationId: requestBillingPortal
      tags: [billing]
      responses: { "200": { description: Hosted portal, content: { application/json: { schema: { $ref: "#/components/schemas/BillingHostedUrl" } } } }, "501": { description: Provider unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentUnavailable" } } } } }
  /billing/cancellation:
    post:
      operationId: requestBillingCancellation
      tags: [billing]
      responses: { "200": { description: Updated overview, content: { application/json: { schema: { $ref: "#/components/schemas/BillingOverview" } } } }, "501": { description: Provider unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentUnavailable" } } } } }
  /onboarding:
    get:
      operationId: getOnboarding
      tags: [onboarding]
      responses: { "200": { description: Onboarding state, content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingState" } } } } }
    post:
      operationId: startOnboarding
      tags: [onboarding]
      responses: { "201": { description: Started onboarding, content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingState" } } } } }
  /onboarding/progress:
    patch:
      operationId: updateOnboarding
      tags: [onboarding]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingUpdate" } } } }
      responses: { "200": { description: Updated onboarding, content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingState" } } } } }
  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      responses: { "200": { description: Completed onboarding, content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingState" } } } } }
  /onboarding/skip:
    post:
      operationId: skipOnboarding
      tags: [onboarding]
      responses: { "200": { description: Skipped onboarding, content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingState" } } } } }
  /billing/usage:
    get:
      operationId: getBillingUsage
      tags: [billing]
      responses: { "200": { description: Usage overview, content: { application/json: { schema: { $ref: "#/components/schemas/UsageOverview" } } } } }
  /dev/billing/simulate:
    post:
      operationId: simulateBillingState
      tags: [billing]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BillingSimulationInput" } } } }
      responses: { "200": { description: Simulated state, content: { application/json: { schema: { $ref: "#/components/schemas/BillingOverview" } } } }, "404": { description: Not available } }

  /jobs/{id}/evidence-summary:
    get:
      operationId: getJobEvidenceSummary
      tags: [jobs]
      summary: Get private job actual-cost evidence summary
      security: [{ ClerkAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/JobEvidenceJobId" }]
      responses:
        "200": { description: Private summary, content: { application/json: { schema: { $ref: "#/components/schemas/JobEvidenceSummary" } } } }
  /jobs/{id}/evidence/{kind}:
    get:
      operationId: listJobEvidence
      tags: [jobs]
      security: [{ ClerkAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/JobEvidenceJobId" }, { name: kind, in: path, required: true, schema: { type: string } }, { name: limit, in: query, schema: { type: number } }, { name: offset, in: query, schema: { type: number } }]
      responses: { "200": { description: Evidence page, content: { application/json: { schema: { $ref: "#/components/schemas/EvidencePage" } } } } }
    post:
      operationId: createJobEvidence
      tags: [jobs]
      security: [{ ClerkAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/JobEvidenceJobId" }, { name: kind, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/JobEvidenceInput" } } } }
      responses: { "201": { description: Created evidence, content: { application/json: { schema: { $ref: "#/components/schemas/JobEvidence" } } } } }
  /jobs/{id}/evidence/{kind}/{rowId}:
    patch:
      operationId: updateJobEvidence
      tags: [jobs]
      security: [{ ClerkAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/JobEvidenceJobId" }, { name: kind, in: path, required: true, schema: { type: string } }, { name: rowId, in: path, required: true, schema: { type: number } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/JobEvidenceUpdate" } } } }
      responses: { "200": { description: Updated evidence, content: { application/json: { schema: { $ref: "#/components/schemas/JobEvidence" } } } } }
  /jobs/{id}/evidence/{kind}/{rowId}/{action}:
    post:
      operationId: actionJobEvidence
      tags: [jobs]
      security: [{ ClerkAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/JobEvidenceJobId" }, { name: kind, in: path, required: true, schema: { type: string } }, { name: rowId, in: path, required: true, schema: { type: number } }, { name: action, in: path, required: true, schema: { type: string, enum: [confirm, ignore] } }]
      responses: { "200": { description: Updated evidence, content: { application/json: { schema: { $ref: "#/components/schemas/JobEvidence" } } } } }
  /materials:
    get:
      operationId: listMaterials
      tags: [jobs]
      security: [{ ClerkAuth: [] }]
      parameters: [{ name: search, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: number } }, { name: offset, in: query, schema: { type: number } }]
      responses: { "200": { description: Tenant material page, content: { application/json: { schema: { $ref: "#/components/schemas/MaterialPage" } } } } }
    post:
      operationId: createMaterial
      tags: [jobs]
      security: [{ ClerkAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MaterialInput" } } } }
      responses: { "201": { description: Created material, content: { application/json: { schema: { $ref: "#/components/schemas/Material" } } } } }
  /materials/{materialId}/history:
    get:
      operationId: listMaterialCostHistory
      tags: [jobs]
      security: [{ ClerkAuth: [] }]
      parameters: [{ name: materialId, in: path, required: true, schema: { type: number } }]
      responses: { "200": { description: Immutable history, content: { application/json: { schema: { $ref: "#/components/schemas/MaterialHistoryPage" } } } } }
  /materials/{materialId}:
    patch:
      operationId: updateMaterial
      tags: [jobs]
      security: [{ ClerkAuth: [] }]
      parameters: [{ name: materialId, in: path, required: true, schema: { type: number } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MaterialUpdate" } } } }
      responses: { "200": { description: Updated material, content: { application/json: { schema: { $ref: "#/components/schemas/Material" } } } } }
  /jobs/{id}/finance-allocations:
    get:
      operationId: listJobFinanceAllocations
      tags: [jobs]
      security: [{ ClerkAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/JobEvidenceJobId" }]
      responses: { "200": { description: Explicit finance allocations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceAllocation" } } } } } }
    post:
      operationId: createJobFinanceAllocation
      tags: [jobs]
      security: [{ ClerkAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/JobEvidenceJobId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceAllocationInput" } } } }
      responses: { "201": { description: Created allocation, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceAllocation" } } } } }
  /jobs/{id}/finance-allocations/{allocationId}:
    delete:
      operationId: deleteJobFinanceAllocation
      tags: [jobs]
      security: [{ ClerkAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/JobEvidenceJobId" }, { name: allocationId, in: path, required: true, schema: { type: number } }]
      responses: { "204": { description: Allocation deleted } }
  /finance/hmrc/preparations:
    get:
      operationId: listHmrcQuarterlyPreparations
      tags: [finance]
      security: [{ ClerkAuth: [] }]
      responses:
        "200": { description: Tenant-scoped preparations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HmrcQuarterlyPreparation" } } } } }
    post:
      operationId: createHmrcQuarterlyPreparation
      tags: [finance]
      summary: Prepare an Income Tax MTD sandbox quarter from confirmed finance records
      security: [{ ClerkAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obligationKey, periodStart, periodEnd]
              properties:
                obligationKey: { type: string }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
      responses:
        "201": { description: Tenant-scoped MTD preparation; never a production filing, content: { application/json: { schema: { $ref: "#/components/schemas/HmrcQuarterlyPreparation" } } } }
        "402": { description: Advanced Finance / MTD entitlement required }
  /finance/hmrc/submissions:
    get:
      operationId: listHmrcSandboxSubmissionAttempts
      tags: [finance]
      summary: List tenant-scoped Income Tax MTD sandbox submission attempts
      security: [{ ClerkAuth: [] }]
      responses:
        "200": { description: Submission attempt history, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HmrcSubmissionAttempt" } } } } }
  /finance/hmrc/preparations/{id}/submit:
    post:
      operationId: submitHmrcSandboxPreparation
      tags: [finance]
      summary: Submit a human-reviewed Income Tax MTD preparation through the configured sandbox gateway
      description: Returns unavailable unless verified gateway evidence is configured; never reports success without an HMRC reference.
      security: [{ ClerkAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declaration, idempotencyKey]
              properties:
                declaration: { type: boolean, enum: [true] }
                idempotencyKey: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
      responses:
        "200": { description: Idempotent prior attempt, content: { application/json: { schema: { $ref: "#/components/schemas/HmrcSubmissionAttempt" } } } }
        "503": { description: Gateway unavailable or evidence incomplete; no HMRC success claimed, content: { application/json: { schema: { $ref: "#/components/schemas/HmrcSubmissionAttempt" } } } }
  /finance/hmrc/fraud-header-validation:
    post:
      operationId: validateHmrcSandboxFraudHeaders
      tags: [finance]
      summary: Validate sandbox fraud headers through the controlled gateway
      security: [{ ClerkAuth: [] }]
      responses:
        "200": { description: Gateway validation confirmed, content: { application/json: { schema: { $ref: "#/components/schemas/HmrcFraudValidationStatus" } } } }
        "503": { description: Validation unavailable; validation was not claimed, content: { application/json: { schema: { $ref: "#/components/schemas/HmrcFraudValidationStatus" } } } }

components:
  parameters:
    JobEvidenceJobId:
      name: id
      in: path
      required: true
      schema: { type: number }
    TimelineLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    TimelineOffset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    TimelineOrder:
      name: order
      in: query
      required: false
      schema: { type: string, enum: [newest, oldest], default: newest }
    TimelineCategory:
      name: category
      in: query
      required: false
      schema: { type: string, enum: [messages, calls, quotes, jobs, invoices_payments] }
    FinanceRecordId:
      name: id
      in: path
      required: true
      schema:
        type: number
    FinancePeriodFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
    FinancePeriodTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
  schemas:
    HmrcFraudValidationStatus:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [validated, unavailable] }
        message: { type: [string, "null"] }
    HmrcPreparationWarnings:
      type: object
      required: [unreviewedExpenseIds, missingEvidenceExpenseIds, uncategorisedExpenseIds, unsupportedExpenseIds, potentialDuplicateExpenseIds]
      properties:
        unreviewedExpenseIds: { type: array, items: { type: number } }
        missingEvidenceExpenseIds: { type: array, items: { type: number } }
        uncategorisedExpenseIds: { type: array, items: { type: number } }
        unsupportedExpenseIds: { type: array, items: { type: number } }
        potentialDuplicateExpenseIds: { type: array, items: { type: number } }
    HmrcQuarterlyFigures:
      type: object
      required: [incomeTotal, expenseTotal, netProfit, expenseCategories, includedIncomeIds, includedExpenseIds, warnings, readyForSubmission]
      properties:
        incomeTotal: { type: number }
        expenseTotal: { type: number }
        netProfit: { type: number }
        expenseCategories: { type: array, items: { type: object, required: [category, amount], properties: { category: { type: string }, amount: { type: number } } } }
        includedIncomeIds: { type: array, items: { type: number } }
        includedExpenseIds: { type: array, items: { type: number } }
        warnings: { $ref: "#/components/schemas/HmrcPreparationWarnings" }
        readyForSubmission: { type: boolean }
    HmrcQuarterlyPreparation:
      type: object
      required: [id, obligationKey, businessId, businessType, obligationStatus, periodStart, periodEnd, figures, payloadHash, status]
      properties:
        id: { type: number }
        obligationKey: { type: string }
        businessId: { type: string }
        businessType: { type: string }
        dueDate: { type: [string, "null"], format: date }
        obligationStatus: { type: string }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        figures: { $ref: "#/components/schemas/HmrcQuarterlyFigures" }
        payloadHash: { type: string }
        status: { type: string }
    HmrcSubmissionAttempt:
      type: object
      required: [id, preparationId, idempotencyKey, status, payloadHash, attemptedAt]
      properties:
        id: { type: number }
        preparationId: { type: number }
        idempotencyKey: { type: string }
        status: { type: string, enum: [pending, submitted, retry_required, failed] }
        payloadHash: { type: string }
        hmrcReference: { type: [string, "null"] }
        safeResponse: { type: [object, "null"], additionalProperties: true }
        safeError: { type: [string, "null"] }
        attemptedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    TimelineEvent:
      type: object
      required: [id, category, eventType, occurredAt, title, detail, channel, amount, status, actionLabel, actionHref]
      properties:
        id: { type: string }
        category: { type: string, enum: [messages, calls, quotes, jobs, invoices_payments] }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        title: { type: string }
        detail: { type: ["string", "null"] }
        channel: { type: ["string", "null"] }
        amount: { type: ["number", "null"] }
        status: { type: ["string", "null"] }
        actionLabel: { type: ["string", "null"] }
        actionHref: { type: ["string", "null"] }
        dateOnly: { type: ["boolean", "null"] }
        transcriptAvailable: { type: ["boolean", "null"] }
        attachment:
          type: ["object", "null"]
          required: [filename, mimetype, fileSize]
          properties:
            filename: { type: string }
            mimetype: { type: string }
            fileSize: { type: ["number", "null"] }
    TimelinePage:
      type: object
      required: [events, hasMore, nextOffset]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/TimelineEvent" } }
        hasMore: { type: boolean }
        nextOffset: { type: ["number", "null"] }
    BillingPlan:
      type: object
      required: [code, name, description, monthlyPriceGbp, trialPriceGbp, trialDays, featureCategories, usageLimits, includedAllowance, overagePolicy, active, comingSoon, sortOrder, purchasable, configurationMessage]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        monthlyPriceGbp: { type: number }
        trialPriceGbp: { type: number }
        trialDays: { type: number }
        featureCategories: { type: array, items: { type: string } }
        usageLimits: { type: ["object", "null"], additionalProperties: { type: number } }
        includedAllowance: { type: ["object", "null"], additionalProperties: { type: number } }
        overagePolicy: { type: ["object", "null"], additionalProperties: true }
        active: { type: boolean }
        comingSoon: { type: boolean }
        sortOrder: { type: number }
        purchasable: { type: boolean }
        configurationMessage: { type: ["string", "null"] }
    BillingAddOn:
      type: object
      required: [code, name, description, monthlyPriceGbp, trialPriceGbp, trialDays, featureCategories, usageLimits, includedAllowance, overagePolicy, active, comingSoon, sortOrder, purchasable, configurationMessage]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        monthlyPriceGbp: { type: ["number", "null"] }
        trialPriceGbp: { type: ["number", "null"] }
        trialDays: { type: number }
        featureCategories: { type: array, items: { type: string } }
        usageLimits: { type: ["object", "null"], additionalProperties: { type: number } }
        includedAllowance: { type: ["object", "null"], additionalProperties: { type: number } }
        overagePolicy: { type: ["object", "null"], additionalProperties: true }
        active: { type: boolean }
        comingSoon: { type: boolean }
        sortOrder: { type: number }
        purchasable: { type: boolean }
        configurationMessage: { type: ["string", "null"] }
    BillingCatalog:
      type: object
      required: [plans, addOns]
      properties:
        plans: { type: array, items: { $ref: "#/components/schemas/BillingPlan" } }
        addOns: { type: array, items: { $ref: "#/components/schemas/BillingAddOn" } }
    InternalBillingCatalogItem:
      type: object
      required: [id, code, name, description, monthlyPriceGbp, trialPercentage, manualTrialPriceGbp, trialDays, featureCategories, usageLimits, includedAllowance, overagePolicy, active, comingSoon, sortOrder, stripeProductId, stripeRecurringPriceId, stripeTrialPriceId, stripeMappingValidatedAt, updatedByUserId]
      properties:
        id: { type: number }
        code: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        monthlyPriceGbp: { type: ["number", "null"] }
        trialPercentage: { type: number }
        manualTrialPriceGbp: { type: ["number", "null"] }
        trialDays: { type: ["number", "null"] }
        featureCategories: { type: array, items: { type: string } }
        usageLimits: { type: ["object", "null"], additionalProperties: { type: number } }
        includedAllowance: { type: ["object", "null"], additionalProperties: { type: number } }
        overagePolicy: { type: ["object", "null"], additionalProperties: true }
        active: { type: boolean }
        comingSoon: { type: boolean }
        sortOrder: { type: number }
        stripeProductId: { type: ["string", "null"] }
        stripeRecurringPriceId: { type: ["string", "null"] }
        stripeTrialPriceId: { type: ["string", "null"] }
        stripeMappingValidatedAt: { type: ["string", "null"], format: date-time }
        updatedByUserId: { type: ["string", "null"] }
    InternalBillingCatalog:
      type: object
      required: [plans, addOns, receptionistTopUpPacks]
      properties:
        plans: { type: array, items: { $ref: "#/components/schemas/InternalBillingCatalogItem" } }
        addOns: { type: array, items: { $ref: "#/components/schemas/InternalBillingCatalogItem" } }
        receptionistTopUpPacks: { type: array, items: { $ref: "#/components/schemas/InternalReceptionistTopUpPack" } }
    InternalBillingProfitability:
      type: object
      required: [companyId, period, subscriptionRevenueGbp, topUpRevenueGbp, totalRevenueGbp, directProviderCosts, costsCompleteForGbpMargin, missingCostState, directProviderCostGbp, grossContributionGbp, calls]
      properties:
        companyId: { type: number }
        period:
          type: object
          required: [startsAt, endsAt]
          properties:
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
        subscriptionRevenueGbp: { type: number }
        topUpRevenueGbp: { type: number }
        totalRevenueGbp: { type: number }
        directProviderCosts:
          type: array
          items:
            type: object
            required: [currency, amount, callCount]
            properties:
              currency: { type: ["string", "null"], description: "Null means currency was unavailable from Vapi." }
              amount: { type: ["number", "null"], description: "Null means one or more provider costs in this group were unavailable." }
              callCount: { type: number }
        costsCompleteForGbpMargin: { type: boolean }
        missingCostState: { type: ["string", "null"] }
        directProviderCostGbp: { type: ["number", "null"] }
        grossContributionGbp: { type: ["number", "null"], description: "Null unless every direct provider cost is authoritatively GBP and present." }
        calls:
          type: array
          items:
            type: object
            required: [callId, durationSeconds, providerCostAmount, providerCostCurrency, date]
            properties:
              callId: { type: ["string", "null"] }
              durationSeconds: { type: number }
              providerCostAmount: { type: ["number", "null"] }
              providerCostCurrency: { type: ["string", "null"] }
              date: { type: string, format: date-time }
    BillingOverview:
      type: object
      required: [legacyAccess, status, planCode, addOnCodes, pendingPlanCode, pendingAddOnCodes, cancelAtPeriodEnd, provider, trialEndsAt, currentPeriodStartsAt, currentPeriodEndsAt, cancelledAt, failedPaymentAt]
      properties:
        legacyAccess: { type: boolean }
        status: { type: ["string", "null"] }
        planCode: { type: ["string", "null"] }
        addOnCodes: { type: array, items: { type: string } }
        pendingPlanCode: { type: ["string", "null"] }
        pendingAddOnCodes: { type: array, items: { type: string } }
        cancelAtPeriodEnd: { type: boolean }
        provider: { type: ["string", "null"] }
        trialEndsAt: { type: ["string", "null"], format: date-time }
        currentPeriodStartsAt: { type: ["string", "null"], format: date-time }
        currentPeriodEndsAt: { type: ["string", "null"], format: date-time }
        cancelledAt: { type: ["string", "null"], format: date-time }
        failedPaymentAt: { type: ["string", "null"], format: date-time }
    BillingSelectionInput:
      type: object
      required: [planCode, addOnCodes]
      properties:
        planCode: { type: string, enum: [core, complete] }
        addOnCodes: { type: array, items: { type: string } }
    PaymentUnavailable:
      type: object
      required: [code, message]
      properties: { code: { type: string, enum: [PAYMENT_SETUP_UNAVAILABLE] }, message: { type: string } }
    BillingHostedUrl:
      type: object
      required: [ok, url]
      properties:
        ok: { type: boolean, enum: [true] }
        url: { type: string }
    OnboardingState:
      type: object
      required: [exists, status, currentStep, data]
      properties:
        exists: { type: boolean }
        status: { type: ["string", "null"] }
        currentStep: { type: ["string", "null"] }
        data: { type: object, additionalProperties: true }
    OnboardingUpdate:
      type: object
      properties:
        currentStep: { type: string }
        data: { type: object, additionalProperties: true }
    UsageOverview:
      type: object
      required: [events, period, aiReceptionist]
      properties:
        period:
          type: ["object", "null"]
          properties:
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            developmentFallback: { type: boolean }
          required: [startsAt, endsAt, developmentFallback]
        events:
          type: array
          items:
            type: object
            required: [featureCode, usageCategory, unit, quantity, limit, remaining, percentageUsed]
            properties:
              featureCode: { type: string }
